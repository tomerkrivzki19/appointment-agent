services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "4000"
      GOOGLE_TOKEN_DIR: /app/data
    volumes:
      - google_tokens:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      APPOINTMENT_SERVICE_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  google_tokens:
